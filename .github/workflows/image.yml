name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/he-overlay

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Third-party actions are pinned to a commit SHA, not to a tag. A `vN` tag
      # is reassignable by its owner, and these steps hold a token with
      # packages: write — the tj-actions/changed-files compromise of March 2025
      # followed exactly that path. Dependabot raises the pins.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Computed before the build so its labels land in the image we verify —
      # the very image that gets pushed.
      #
      # `latest` is published on a version tag only, never on a push to main.
      # Watchtower follows `latest` and redeploys within minutes, so this is the
      # one place where a human decision still stands between a commit and
      # production. Pushes to main publish `sha-…` and nothing else.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Built once, into the local daemon. Nothing is pushed before it has been
      # probed, and what gets pushed is this exact image — not a rebuild that
      # merely shares a cache.
      - name: Build for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: he-overlay:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify served headers
        run: ./scripts/check-headers.sh

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retagging the verified image, so the digest that reaches the registry is
      # the digest that passed check-headers.sh.
      - name: Push the verified image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            [ -z "$tag" ] && continue
            docker tag he-overlay:ci "$tag"
            docker push "$tag"
          done
