# `$uri` rather than `$request`: the latter carries the query string, and an
# overlay URL configured the old way holds the user's OBS password. We host this
# page, so logging it would mean keeping a credential that is not ours. The
# password now travels in the fragment (src/overlay/params.ts), which never
# reaches a server at all — this covers the sources not migrated yet.
log_format no-query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log no-query;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness probe for Traefik. No security headers here: the response is not
    # HTML and is never rendered by a browser.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite hashes these filenames: the name changes with the content, so the
    # cache can be permanent.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The three pages, on the other hand, are never hashed.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
