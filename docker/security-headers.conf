# WARNING — `add_header` is inherited ONLY if the child block declares none of
# its own. This fragment must therefore be included in EVERY `location`: adding
# a lone Cache-Control somewhere without re-including it would wipe out the
# whole security policy at that spot, without a single message.

# `connect-src` has to name the loopback explicitly: the page is served over
# HTTPS and connects to obs-websocket in the clear (spec §2.1, §5.5). The port
# wildcard is required, since the port is configurable (spec §6.1).
#
# Never add `upgrade-insecure-requests` nor `block-all-mixed-content`: either
# one would target exactly that connection.
#
# `connect-src` deliberately omits 'self': once loaded, the app issues no HTTP
# request at all — its only network flow is that WebSocket. Allowing 'self'
# would leave a POST channel back to our origin, whose request body appears in
# no access log, for any script that manages to run in the page. Adding a
# fetch() later has to be a decision; check-headers.sh fails if 'self' returns.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src ws://localhost:* ws://127.0.0.1:*; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;

# `style-src 'unsafe-inline'` is deliberate: overlay.html carries its
# transparent background in a <style> tag, which must apply before the module
# loads. The risk is nil on pages that hold no third-party content.

# WebHID is subject to Permissions-Policy. Omitting the header would leave the
# permissive default, but writing it closes the other sensors and documents the
# fact that `hid` is a hard dependency of the product.
add_header Permissions-Policy "hid=(self), serial=(), usb=(), camera=(), microphone=(), geolocation=()" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
